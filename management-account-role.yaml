AWSTemplateFormatVersion: '2010-09-09'
Description: Management Account Role for Eon Bulk Recovery - Enables role chaining from backup account to restore accounts

Parameters:
  BackupAccountId:
    Type: String
    Description: AWS account ID where the Eon Bulk Recovery application is deployed
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a valid 12-digit AWS account ID

  LambdaExecutionRoleName:
    Type: String
    Description: >-
      Name of the Lambda execution role in the backup account that may assume this
      role. The application names that role ${StackName}-lambda-role, so the
      eon-bulk-recovery stack uses eon-bulk-recovery-lambda-role.
    Default: eon-bulk-recovery-lambda-role

Resources:
  EonBulkRecoveryChainRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EonBulkRecoveryChainRole
      Description: Allows Eon Bulk Recovery application to chain through to restore accounts
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${BackupAccountId}:role/${LambdaExecutionRoleName}'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OrganizationAccountAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - 'arn:aws:iam::*:role/OrganizationAccountAccessRole'
                  - 'arn:aws:iam::*:role/AWSControlTowerExecution'
      Tags:
        - Key: Application
          Value: EonBulkRecovery
        - Key: Purpose
          Value: RoleChaining

Outputs:
  RoleArn:
    Description: ARN of the EonBulkRecoveryChainRole
    Value: !GetAtt EonBulkRecoveryChainRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ChainRole'

  RoleName:
    Description: Name of the EonBulkRecoveryChainRole
    Value: !Ref EonBulkRecoveryChainRole
