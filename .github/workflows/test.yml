name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Lambda runtime in template.yaml.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/requirements.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - run: sam validate --lint --template template.yaml

      - name: Validate the state machine is well-formed JSON
        run: python -c "import json; json.load(open('statemachine.asl.json'))"
